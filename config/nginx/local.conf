# Local development nginx configuration
# This config allows HTTP access on localhost for testing

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

# upstream for uWSGI
upstream uwsgi_app {
    server unix:/code/config_educa/uwsgi_app.sock;
}

# upstream for Daphne (WebSocket)
upstream daphne {
    server unix:/code/config_educa/daphne.sock;
}

# HTTP server for localhost (development)
server {
    listen 80;
    server_name localhost 127.0.0.1;
    error_log stderr warn;
    access_log /dev/stdout main;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Apply rate limiting
    limit_req zone=general burst=20 nodelay;

    # Django application via uWSGI
    location / {
        include /etc/nginx/uwsgi_params;
        uwsgi_pass uwsgi_app;
    }

    # WebSocket support
    location /ws/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
        proxy_pass http://daphne;
    }

    # Static files
    location /static/ {
        alias /code/config_educa/static/;
    }

    # Media files
    location /media/ {
        alias /code/config_educa/media/;
    }
}

# Production server (HTTPS redirect) - kept for reference
server {
    listen 80;
    server_name www.educto.io educto.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    ssl_certificate /code/config_educa/ssl/config_educa.pem;
    ssl_certificate_key /code/config_educa/ssl/config_educa.key;
    server_name www.educto.io educto.io;
    error_log stderr warn;
    access_log /dev/stdout main;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;

    # Apply rate limiting
    limit_req zone=general burst=20 nodelay;

    location / {
        include /etc/nginx/uwsgi_params;
        uwsgi_pass uwsgi_app;
    }

    location /ws/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
        proxy_pass http://daphne;
    }

    location /static/ {
        alias /code/config_educa/static/;
    }

    location /media/ {
        alias /code/config_educa/media/;
    }
}
