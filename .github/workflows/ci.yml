name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ---------------------------------------------------------------------------
  # Django unit + integration tests on production-pinned Python 3.10
  # ---------------------------------------------------------------------------
  django-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.0.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run migrations check
        working-directory: config_educa
        env:
          DJANGO_SETTINGS_MODULE: config_educa.settings.local
          DJANGO_SECRET_KEY: ci-only-not-secret
        run: python manage.py check
      - name: Run test suite
        working-directory: config_educa
        env:
          DJANGO_SETTINGS_MODULE: config_educa.settings.local
          DJANGO_SECRET_KEY: ci-only-not-secret
          REDIS_HOST: localhost
        run: python manage.py test --verbosity=2

  # ---------------------------------------------------------------------------
  # Playwright E2E against the runserver
  # ---------------------------------------------------------------------------
  playwright:
    runs-on: ubuntu-latest
    needs: django-tests
    services:
      redis:
        image: redis:7.0.4
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package.json
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium firefox webkit
      - name: Migrate + seed E2E fixtures
        working-directory: config_educa
        env:
          DJANGO_SETTINGS_MODULE: config_educa.settings.local
          DJANGO_SECRET_KEY: ci-only-not-secret
        run: |
          python manage.py migrate --noinput
          python manage.py seed_e2e
      - name: Start Django server in background
        working-directory: config_educa
        env:
          DJANGO_SETTINGS_MODULE: config_educa.settings.local
          DJANGO_SECRET_KEY: ci-only-not-secret
        run: |
          nohup python manage.py runserver 127.0.0.1:8000 > /tmp/runserver.log 2>&1 &
          # Wait up to 30s for the server
          for i in {1..30}; do
            curl -sf http://127.0.0.1:8000/ > /dev/null && break
            sleep 1
          done
      - name: Run Playwright
        working-directory: e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Optional: live LLM smoke (manual trigger only \u2014 costs money)
  # ---------------------------------------------------------------------------
  live-llm-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - name: Run live LLM tests
        working-directory: config_educa
        env:
          DJANGO_SETTINGS_MODULE: config_educa.settings.local
          DJANGO_SECRET_KEY: ci-only-not-secret
          RUN_LIVE_LLM_TESTS: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python manage.py test ai_tools.test_live_llm --verbosity=2
