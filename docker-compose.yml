services:

  cache:
    image: redis:7.0.4
    restart: always
    volumes:
      - ./data/cache:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  db:
    image: postgres:14.5
    restart: always
    volumes:
      - ./data/db:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  web:
    build: .
    command: [ "./wait-for-it.sh", "db:5432", "--", "uwsgi", "--ini", "/code/config/uwsgi/uwsgi.ini" ]
    restart: always
    volumes:
      - .:/code
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config_educa.settings.prod
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -S /code/config_educa/uwsgi_app.sock || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  daphne:
    build: .
    working_dir: /code/config_educa/
    command: [ "../wait-for-it.sh", "db:5432", "--",
               "daphne", "-u", "/code/config_educa/daphne.sock",
               "config_educa.asgi:application" ]
    restart: always
    volumes:
      - .:/code
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config_educa.settings.prod
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -S /code/config_educa/daphne.sock || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  worker:
    build: .
    working_dir: /code/config_educa/
    command: ["../wait-for-it.sh", "db:5432", "--",
              "celery", "-A", "config_educa", "worker",
              "-l", "info", "--concurrency=4"]
    restart: always
    volumes:
      - .:/code
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config_educa.settings.prod
      - CELERY_TASK_ALWAYS_EAGER=False
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config_educa inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  beat:
    build: .
    working_dir: /code/config_educa/
    command: ["../wait-for-it.sh", "db:5432", "--",
              "celery", "-A", "config_educa", "beat",
              "-l", "info",
              "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    restart: always
    volumes:
      - .:/code
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config_educa.settings.prod
      - CELERY_TASK_ALWAYS_EAGER=False
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      worker:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  nginx:
    image: nginx:1.23.1
    restart: always
    volumes:
      - ./config/nginx:/etc/nginx/templates
      - ./config/certbot/conf:/etc/letsencrypt
      - ./config/certbot/www:/var/www/certbot
      - .:/code
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - daphne
    healthcheck:
      test: ["CMD", "service", "nginx", "status"]
      interval: 30s
      timeout: 5s
      retries: 5
